<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS - المساعد الذكي</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      direction: rtl;
    }

    /* الدائرة النارية الذهبية */
    .fire-circle {
      position: fixed;
      width: 600px;
      height: 600px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      animation: rotate 25s linear infinite;
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .fire-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255, 255, 0, 0.95), transparent 25%),
        radial-gradient(circle at 70% 35%, rgba(255, 200, 0, 0.9), transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(255, 150, 0, 0.85), transparent 30%),
        radial-gradient(circle at 60% 70%, rgba(255, 100, 0, 0.8), transparent 25%),
        radial-gradient(circle at 40% 65%, rgba(255, 180, 0, 0.75), transparent 22%);
      border-radius: 50%;
      filter: drop-shadow(0 0 40px rgba(255, 200, 0, 1)) 
              drop-shadow(0 0 80px rgba(255, 150, 0, 0.8))
              drop-shadow(0 0 120px rgba(255, 100, 0, 0.6));
    }

    /* خطوط نارية */
    .fire-line {
      position: absolute;
      background: linear-gradient(90deg, rgba(255, 255, 0, 0.8), rgba(255, 150, 0, 0.4), transparent);
      animation: shootFlare 2s ease-in-out infinite;
    }

    .line1 {
      width: 120px;
      height: 4px;
      top: 30%;
      left: -50px;
      animation-delay: 0s;
      transform-origin: right center;
    }

    .line2 {
      width: 150px;
      height: 3px;
      top: 20%;
      right: -60px;
      animation-delay: 0.5s;
      transform-origin: left center;
    }

    .line3 {
      width: 130px;
      height: 4px;
      bottom: 25%;
      left: -40px;
      animation-delay: 1s;
      transform-origin: right center;
    }

    .line4 {
      width: 140px;
      height: 3px;
      bottom: 35%;
      right: -50px;
      animation-delay: 1.5s;
      transform-origin: left center;
    }

    @keyframes shootFlare {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* نقاط الضوء */
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #ffff00;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffff00;
      animation: sparkFloat 3s ease-in-out infinite;
    }

    @keyframes sparkFloat {
      0% { opacity: 0; transform: translate(0, 0) scale(1); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.5); }
    }

    .app {
      position: relative;
      width: min(1000px, 95vw);
      height: 90vh;
      background: rgba(10, 14, 39, 0.92);
      border: 1.5px solid rgba(255, 200, 0, 0.25);
      border-radius: 32px;
      box-shadow:
        0 0 0 1px rgba(255, 200, 0, 0.15),
        0 30px 80px rgba(0, 0, 0, 0.9),
        0 0 60px rgba(255, 200, 0, 0.2),
        inset 0 0 40px rgba(255, 200, 0, 0.05);
      backdrop-filter: blur(20px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 32px;
      border-bottom: 1px solid rgba(255, 200, 0, 0.15);
      background: rgba(15, 23, 42, 0.75);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 24px;
      color: #ffc800;
      text-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
    }

    .logo {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffc800, #ffb700);
      box-shadow: 0 0 25px rgba(255, 200, 0, 1), 0 0 50px rgba(255, 200, 0, 0.6);
      position: relative;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { 
        box-shadow: 0 0 25px rgba(255, 200, 0, 1), 0 0 50px rgba(255, 200, 0, 0.6);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 0 35px rgba(255, 200, 0, 1), 0 0 70px rgba(255, 200, 0, 0.8);
        transform: scale(1.1);
      }
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffc800;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(255, 200, 0, 0.5);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6b00;
      box-shadow: 0 0 15px #ff6b00;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 200, 0, 0.3) transparent;
    }

    .message {
      display: flex;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from { 
        opacity: 0; 
        transform: translateY(20px);
      }
      to { 
        opacity: 1; 
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 16px 20px;
      border-radius: 20px;
      line-height: 1.7;
      font-size: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.5);
      word-wrap: break-word;
    }

    .message.assistant .bubble {
      background: linear-gradient(135deg, rgba(255, 200, 0, 0.15), rgba(255, 150, 0, 0.12));
      border: 1px solid rgba(255, 200, 0, 0.3);
      color: #fff9e6;
      border-bottom-right-radius: 8px;
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.15);
    }

    .message.user .bubble {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #f0f9ff;
      border-bottom-left-radius: 8px;
    }

    .input-area {
      border-top: 1px solid rgba(255, 200, 0, 0.15);
      padding: 24px 28px;
      background: rgba(15, 23, 42, 0.8);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(255, 200, 0, 0.25);
      border-radius: 22px;
      padding: 12px 16px;
      transition: 0.3s ease;
    }

    .input-row:focus-within {
      border-color: rgba(255, 200, 0, 0.5);
      box-shadow: 0 0 20px rgba(255, 200, 0, 0.2);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 16px;
      padding: 8px 12px;
    }

    input::placeholder {
      color: rgba(148, 163, 184, 0.6);
    }

    .mic-btn {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255, 200, 0, 0.4);
      border-radius: 14px;
      background: rgba(255, 200, 0, 0.12);
      color: #ffc800;
      font-size: 22px;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn:hover {
      background: rgba(255, 200, 0, 0.2);
      box-shadow: 0 0 15px rgba(255, 200, 0, 0.3);
    }

    .mic-btn.listening {
      animation: micPulse 1s infinite;
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.6);
      color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.35);
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffc800, #ff9800);
      color: #000;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 200, 0, 0.5);
      transition: 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .send-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 12px 35px rgba(255, 200, 0, 0.6);
    }

    .send-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 700;
      color: #ffc800;
      text-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
      margin-bottom: 12px;
    }

    .welcome-text {
      font-size: 18px;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .app {
        border-radius: 24px;
        height: 95vh;
      }

      .bubble {
        max-width: 85%;
      }

      .brand {
        font-size: 18px;
      }

      .fire-circle {
        width: 400px;
        height: 400px;
      }

      input {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <!-- الدائرة النارية الذهبية -->
  <div class="fire-circle">
    <div class="line1"></div>
    <div class="line2"></div>
    <div class="line3"></div>
    <div class="line4"></div>
    <div class="spark" style="top: 20%; left: 15%; --tx: 50px; --ty: -80px; animation-delay: 0s;"></div>
    <div class="spark" style="top: 35%; right: 20%; --tx: -60px; --ty: -60px; animation-delay: 0.3s;"></div>
    <div class="spark" style="bottom: 30%; left: 10%; --tx: 70px; --ty: 50px; animation-delay: 0.6s;"></div>
    <div class="spark" style="bottom: 20%; right: 15%; --tx: -80px; --ty: 40px; animation-delay: 0.9s;"></div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="app">
    <!-- رأس الصفحة -->
    <div class="header">
      <div class="brand">
        <div class="logo"></div>
        <span>JARVIS</span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>متصل</span>
      </div>
    </div>

    <!-- منطقة الحوار -->
    <div class="chat" id="chat">
      <div class="message assistant">
        <div class="bubble">
          <div class="welcome-title">مرحباً بك!</div>
          <div class="welcome-text">أنا JARVIS، جاهز لمساعدتك. اكتب سؤالك أو استخدم المايك 🎤</div>
        </div>
      </div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
      <div class="input-row">
        <input 
          id="userInput" 
          type="text" 
          placeholder="اكتب سؤالك هنا..."
          autocomplete="off"
        />
        <button class="mic-btn" id="micBtn" title="اضغط للتحدث">🎤</button>
        <button class="send-btn" id="sendBtn" title="إرسال">➤</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    let recognition;
    let isListening = false;

    // إعداد التعرف على الكلام
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "ar-SA";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("listening");
        micBtn.textContent = "🔴";
      };

      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        if (transcript) {
          userInput.value = transcript;
          sendMessage();
        }
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤";
      };

      recognition.onerror = () => {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤";
      };
    }

    // دالة حساب العمليات الحسابية
    function evaluateMath(expr) {
      try {
        // إزالة المسافات
        expr = expr.replace(/\s+/g, '');
        
        // التحقق من أن التعبير يحتوي على أرقام وعمليات فقط
        if (!/^[\d+\-*/.()]+$/.test(expr)) {
          return null;
        }

        // حساب النتيجة بشكل آمن
        const result = Function('"use strict"; return (' + expr + ')')();
        
        // التحقق من أن النتيجة رقم صحيح
        if (typeof result === 'number' && isFinite(result)) {
          return result;
        }
        return null;
      } catch {
        return null;
      }
    }

    // الإجابات الذكية
    function getResponse(text) {
      const lower = text.toLowerCase().trim();

      // التحقق من العمليات الحسابية
      const mathMatch = text.match(/(\d+[\s]*[+\-*\/][\s]*\d+[\s]*[+\-*\/]?[\s]*\d*)/i);
      if (mathMatch) {
        const mathExpr = mathMatch[0].replace(/\s+/g, '');
        const result = evaluateMath(mathExpr);
        if (result !== null) {
          return `النتيجة: ${mathExpr} = ${result}`;
        }
      }

      // الترحيبات
      if (/مرحبا|مرحبة|hi|hello|السلام|اهلا|اهلاً/.test(lower)) {
        const greetings = [
          "مرحباً! كيف يمكنني مساعدتك اليوم؟",
          "أهلاً وسهلاً! ما الذي تحتاج؟",
          "أنا هنا لخدمتك. ما أخبارك؟",
          "تشرفت بحضورك! كيف أساعدك؟"
        ];
        return greetings[Math.floor(Math.random() * greetings.length)];
      }

      // الأسئلة عن المشروع
      if (/مشروع|project|jarvis|ما هذا/.test(lower)) {
        const projects = [
          "هذا مشروع JARVIS، مساعد ذكي بواجهة حديثة وخلفية نارية رائعة مع تقنية التحدث والاستماع!",
          "مشروع JARVIS يهدف لتقديم تجربة تفاعلية مميزة مع الذكاء الاصطناعي والعمليات الحسابية.",
          "JARVIS هو مساعدك الذكي الشخصي، يستطيع الرد على أسئلتك وحل العمليات الحسابية."
        ];
        return projects[Math.floor(Math.random() * projects.length)];
      }

      // الأسئلة عن المساعدة
      if (/مساعد|help|ساعد|استطيع|تستطيع|تفعل/.test(lower)) {
        const helps = [
          "أستطيع مساعدتك في الإجابة عن الأسئلة، الشرح، الكتابة، والعمليات الحسابية!",
          "أنا هنا للمساعدة! يمكنك سؤالي عن أي شيء وحتى حل المسائل الحسابية.",
          "أستطيع فعل الكثير: الرد على الأسئلة، حل العمليات الرياضية، والشرح المفصل."
        ];
        return helps[Math.floor(Math.random() * helps.length)];
      }

      // الشكر
      if (/شكر|thanks|شكرا|تشكر/.test(lower)) {
        const thanks = [
          "بكل سرور! أنا هنا دائماً لمساعدتك.",
          "شكراً لك، أتمنى أن أكون قد ساعدتك.",
          "أنا سعيد لمساعدتك! أخبرني إن احتجت أي شيء آخر."
        ];
        return thanks[Math.floor(Math.random() * thanks.length)];
      }

      // الإجابات الافتراضية
      const defaults = [
        "رائع! أستطيع مساعدتك بهذا. هل تريد المزيد من المعلومات؟",
        "فكرة جيدة! دعنا نعمل عليها معاً.",
        "حسناً، أفهمك. كيف يمكنني المساعدة أكثر؟",
        "هذا سؤال ذكي! دعني أفكر به.",
        "نعم، أنا أفهم ما تقصد. هل تريد توضيح أكثر؟"
      ];
      return defaults[Math.floor(Math.random() * defaults.length)];
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ar-SA";
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function addMessage(text, sender = "assistant") {
      const message = document.createElement("div");
      message.className = `message ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      if (sender === "assistant") {
        setTimeout(() => speak(text), 300);
      }
    }

    function sendMessage() {
      const value = userInput.value.trim();
      if (!value) return;

      addMessage(value, "user");
      userInput.value = "";

      const response = getResponse(value);
      setTimeout(() => addMessage(response, "assistant"), 500);
    }

    // أحداث الإرسال
    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // أحداث المايك
    if (recognition) {
      micBtn.addEventListener("click", () => {
        if (isListening) {
          recognition.stop();
        } else {
          userInput.value = "";
          recognition.start();
        }
      });
    } else {
      micBtn.disabled = true;
      micBtn.style.opacity = "0.5";
      micBtn.title = "المايك غير مدعوم في متصفحك";
    }

    // رسالة ترحيب بعد 1 ثانية
    setTimeout(() => {
      speak("مرحباً بك في JARVIS. أنا جاهز لمساعدتك!");
    }, 1000);
  </script>
</body>
</html>
